<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
   
        <header>
            <i class="fa-regular fa-bell"></i>
            <h1>Mr. Praveen </h1>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </header>

        <section class="profile">
            <div class="img_container">
                <img src="media/myPhoto.jpg" alt="my picture">
            </div>
            <div>
                <h2>Praveen Kumar Pandit</h2>

                <section class="user_data">
                    <div class="post">
                        <p>25</p>
                        <p>Posts</p>
                    </div>
                    <div class="followers">
                        <p>483 </p>
                        <p>Followers</p>
                    </div>
                    <div class="following">
                        <p>239</p>
                        <p>Followings</p>
                    </div>
                </section>

                <div class="bio">Hey, You want to grow then follow me right now</div>

            </div>
        </section>

        <nav>
            <i class="fa-solid fa-table-cells"></i>
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-bookmark"></i>
            <i class="fa-solid fa-tag"></i>
            <i class="fa-solid fa-money-bill"></i>
            <i class="fa-solid fa-tv"></i>
        </nav>

        <section class="image_container">
            <img src="media/image1.jpg" class="fadeUp">
            <img src="media/image2.jpg" class="fadeUp">
            <img src="media/image3.jpg" class="fadeUp">
            <img src="media/image4.jpg" class="fadeUp">
            <img src="media/image5.jpg" class="fadeUp">
            <img src="media/image6.jpg" class="fadeUp">
            <img src="media/image7.jpg" class="fadeUp">
            <img src="media/image8.jpg" class="fadeUp">
            <img src="media/image9.jpg" class="fadeUp">
            <img src="media/image10.jpg" class="fadeUp">
            <img src="media/image11.jpg" class="fadeUp">
            <img src="media/image12.jpg" class="fadeUp">
            <img src="media/image13.jpg" class="fadeUp">
            <img src="media/image14.jpg" class="fadeUp">
            <img src="media/image15.jpg" class="fadeUp">
            <img src="media/image16.jpg" class="fadeUp">
            <img src="media/image17.jpg" class="fadeUp">
            <img src="media/image18.jpg" class="fadeUp">
            <img src="media/image19.jpg" class="fadeUp">
            <img src="media/image20.jpg" class="fadeUp">
            <img src="media/image21.jpg" class="fadeUp">
            <img src="media/image22.jpg" class="fadeUp">
            <img src="media/image23.jpg" class="fadeUp">
            <img src="media/image24.jpg" class="fadeUp">
            <img src="media/image25.jpg" class="fadeUp">
        </section>

        <footer>
            <i class="fa-solid fa-video"></i>
            <i class="fa-solid fa-users"></i>
            <i class="fa-solid fa-camera"></i>
            <i class="fa-solid fa-compass"></i>
            <i class="fa-regular fa-circle-user"></i>
        </footer>

  
</body>

</html>
